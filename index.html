<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ಠಿ_ಠ </title>
    <link rel="stylesheet" href="./vendor/bulma/css/bulma.min.css">
    <link rel="stylesheet" href="./vendor/fa-all.min.css">
    <link rel="stylesheet" href="./style/style.css?v=2.0.0">
</head>
<body id="body-bg">

    <nav class="navbar is-transparent" role="navigation">
        <div class="navbar-brand">
            <div class="navbar-item">
                <div class="navbar-items" id="time-btn"></div>
            </div>
        </div>
        <div class="navbar-menu">
            <div class="navbar-end">
                <div class="navbar-item">
                    <div class="navbar-items" id="weather-btn"></div>
                </div>
                <div class="navbar-item">
                    <span class="tag is-light" id="open-count-tag" style="background: rgba(255,255,255,0.08); color: #eee; border: none;">0</span>
                </div>
                <div class="navbar-item">
                    <button id="config-btn" class="button is-dark is-inverted is-outlined is-small">
                        <span class="icon"><i class="fas fa-cog"></i></span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="v-center-wrapper">
        <div class="container px-4">
            <section id="todo-widget" class="todo-widget" hidden aria-label="Lambda to-dos">
                <div class="todo-widget-header">
                    <div class="todo-widget-title">
                        <span class="icon"><i class="fas fa-check-square"></i></span>
                        <span>Lambda to-dos</span>
                        <span id="todo-status" class="todo-status"></span>
                    </div>
                    <form id="todo-add-form" class="todo-add-form">
                        <input id="todo-add-input" class="input is-small" type="text" maxlength="300" placeholder="Add a to-do" autocomplete="off">
                        <button class="button is-small is-dark is-inverted is-outlined" type="submit" title="Add to-do">
                            <span class="icon is-small"><i class="fas fa-plus"></i></span>
                        </button>
                    </form>
                </div>
                <div id="todo-list" class="todo-list"></div>
            </section>

            <div class="columns is-centered is-multiline is-variable is-1" id="link-grid">
                </div>
        </div>
    </div>

    <div id="config-modal" class="modal">
        <div class="modal-background"></div>
        <div class="modal-card">
            <header class="modal-card-head">
                <p class="modal-card-title">Settings</p>
                <button class="delete" id="close-btn"></button>
            </header>
            <section class="modal-card-body">
                <div class="field">
                    <label class="label">Wallpaper URL</label>
                    <input class="input is-small" type="text" id="wallpaper-input">
                </div>
                <div class="columns">
                    <div class="column">
                        <label class="label">Latitude</label>
                        <input class="input is-small" type="text" id="lat-input">
                    </div>
                    <div class="column">
                        <label class="label">Longitude</label>
                        <input class="input is-small" type="text" id="lon-input">
                    </div>
                </div>
                <hr>
                <div class="field">
                    <label class="checkbox">
                        <input type="checkbox" id="todo-enabled-input">
                        Enable Lambda to-dos
                    </label>
                </div>
                <div class="field">
                    <label class="label">Lambda API URL</label>
                    <input class="input is-small" type="url" id="todo-api-url-input" placeholder="https://lambda.example.com">
                    <p class="help">The base URL of your Lambda instance. This integration is disabled by default.</p>
                </div>
                <div class="field">
                    <label class="label">Lambda API Key</label>
                    <input class="input is-small" type="password" id="todo-api-key-input" autocomplete="off" placeholder="Stored only in this browser">
                    <p class="help">The key stays in localStorage and is not included in exported page config.</p>
                </div>
                <hr>
                <div id="menu-editor-list"></div>
                <button class="button is-small is-link is-light is-fullwidth mt-2" id="add-category-btn">+ Add Category</button>
            </section>
            <footer class="modal-card-foot">
                <div style="width:100%; display:flex; gap:8px;">
                    <label class="button is-light" id="export-btn">Export Config</label>
                    <label class="button is-light" for="import-file-input" id="import-btn">Import Config</label>
                    <input type="file" id="import-file-input" accept="application/json" style="display:none">
                    <div style="flex:1"></div>
                    <button class="button is-success" id="save-btn">Save Changes</button>
                </div>
            </footer>
        </div>
    </div>

    <script src="./vendor/moment.min.js"></script>
    <script src="./js/index.js?v=2.0.0"></script>
</body>
</html>
